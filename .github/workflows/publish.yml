name: Publish to PyPI

# Runs on GitHub Release and does two things, neither of which stores a token:
#   1. builds the package and uploads it to PyPI via Trusted Publishing (OIDC)
#   2. registers the release with the official MCP Registry, also via OIDC
# Both sides verify this workflow's own identity instead of a stored secret.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name : cheaplane
#   Owner             : millennialdreamer
#   Repository name   : cheaplane
#   Workflow name     : publish.yml
#   Environment       : (leave blank)
#
# The MCP Registry side needs no setup at all: `login github-oidc` derives the
# io.github.millennialdreamer/* namespace from the OIDC token, and ownership of
# the PyPI package is proven by the `mcp-name:` marker in README.md.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Versions must agree
        # Cheap guard: the registry rejects a server.json whose package version
        # isn't actually on PyPI, and that failure arrives long after the upload
        # is irreversible. Catch the mismatch here instead.
        run: |
          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          SERVER=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          PKG=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "pyproject=$PYPROJECT  server.json=$SERVER  server.json/package=$PKG  ref=$GITHUB_REF_NAME"
          if [ "$PYPROJECT" != "$SERVER" ] || [ "$PYPROJECT" != "$PKG" ]; then
            echo "::error::pyproject.toml and server.json disagree on the version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$PYPROJECT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $PYPROJECT"
            exit 1
          fi

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata renders on PyPI
        run: pipx run twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the identity the registry checks — no secret needed
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Wait for PyPI to serve the new version
        # The registry proves package ownership by reading the mcp-name marker
        # out of the description PyPI serves, so the upload has to be live first.
        run: |
          NAME=$(python3 -c "import json; print(json.load(open('server.json'))['name'])")
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/cheaplane/$VERSION/json" | grep -q "mcp-name: $NAME"; then
              echo "PyPI is serving $VERSION with the ownership marker."
              exit 0
            fi
            echo "attempt $i — not visible yet, retrying in 10s"
            sleep 10
          done
          echo "::error::PyPI never served $VERSION carrying 'mcp-name: $NAME'"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
