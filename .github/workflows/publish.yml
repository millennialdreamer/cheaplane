name: Publish to PyPI

# Publishes on GitHub Release. Uses PyPI Trusted Publishing (OIDC), so there is
# no API token to store anywhere — PyPI verifies the workflow identity itself.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name : cheaplane
#   Owner             : millennialdreamer
#   Repository name   : cheaplane
#   Workflow name     : publish.yml
#   Environment       : (leave blank)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata renders on PyPI
        run: pipx run twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
