<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0e1530"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#64D2FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>

  <!-- wordmark + tagline -->
  <text x="72" y="92" fill="#F5F5F7" font-size="52" font-weight="700" letter-spacing="-1.5">Cheaplane</text>
  <text x="74" y="128" fill="#9aa0aa" font-size="20">Keep your premium model on the main thread — offload the grunt work, with billing that can't cross.</text>

  <!-- premium agent -->
  <rect x="72" y="206" width="214" height="78" rx="16" fill="#0A84FF" fill-opacity="0.14" stroke="#0A84FF" stroke-width="1.5"/>
  <text x="179" y="240" fill="#F5F5F7" font-size="16" font-weight="600" text-anchor="middle">Premium agent</text>
  <text x="179" y="263" fill="#64D2FF" font-size="12.5" text-anchor="middle">stays on your subscription</text>

  <!-- delegate arrow -->
  <line x1="286" y1="245" x2="516" y2="245" stroke="url(#wire)" stroke-width="3" filter="url(#glow)"/>
  <polygon points="524,245 510,238 510,252" fill="#64D2FF"/>
  <text x="401" y="231" fill="#9aa0aa" font-size="13.5" text-anchor="middle" font-style="italic">delegate(task, model)</text>

  <!-- isolation divider -->
  <line x1="566" y1="194" x2="566" y2="298" stroke="#5a5a5e" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="566" y="182" fill="#86868B" font-size="11.5" text-anchor="middle" letter-spacing="0.5">BILLING ISOLATED</text>

  <!-- cheap models -->
  <rect x="600" y="218" width="112" height="54" rx="13" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-width="1.3"/>
  <text x="656" y="250" fill="#F5F5F7" font-size="15" font-weight="600" text-anchor="middle">DeepSeek</text>
  <rect x="727" y="218" width="84" height="54" rx="13" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-width="1.3"/>
  <text x="769" y="250" fill="#F5F5F7" font-size="15" font-weight="600" text-anchor="middle">MiMo</text>
  <rect x="826" y="218" width="80" height="54" rx="13" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-width="1.3"/>
  <text x="866" y="250" fill="#F5F5F7" font-size="15" font-weight="600" text-anchor="middle">Kimi</text>
  <rect x="921" y="218" width="92" height="54" rx="13" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-width="1.3"/>
  <text x="967" y="250" fill="#F5F5F7" font-size="15" font-weight="600" text-anchor="middle">Qwen</text>
  <text x="806" y="298" fill="#86868B" font-size="12.5" text-anchor="middle">cheap models · pay-per-use · your premium quota untouched</text>
</svg>
